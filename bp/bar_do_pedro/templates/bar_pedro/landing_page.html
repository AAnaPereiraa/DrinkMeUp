{% extends 'bar_pedro/base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/landing_page.css' %}">
{% endblock %}

{% block title %}DrinkMeUp{% endblock %}
{% block content %}
    <div class="landing-container">
        <h1>DrinkMeUp</h1>
        <p class="about-text">Make YOUR perfect drink!!!</p>
            {% if not user.is_authenticated %}
                <div class="landing-actions">
                    <a href="{% url 'login' %}" class="landing-btn login-btn">Log in</a>
                    <a href="{% url 'signup' %}" class="landing-btn join-us-btn">Join us</a>
                </div>
            {% endif %} 
    </div>


{% endblock%}

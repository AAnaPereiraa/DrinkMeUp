{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>{% block title %}base{% endblock %}</title>
        <script src="{% static 'navbar_js.js' %}"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
        {% block extra_css %}{% endblock %}
        {% block bootstrap %}{% endblock %}
        <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    </head>
    <body>
        <header>
            {% include 'bar_pedro/navbar_profile.html' %}
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
        <footer class="site-footer">
            <div class="site-footer-inner">
                <span class="site-footer-name">DrinkMeUp</span>
                <nav class="site-footer-links" aria-label="Legal">
                    <a href="{% url 'imprint' %}">Imprint</a>
                    <a href="{% url 'privacy_policy' %}">Privacy Policy</a>
                </nav>
            </div>
        </footer>

    </body>
</html>
